name: Release

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Platform wheel jobs to run
        type: choice
        required: true
        default: all
        options:
          - all
          - linux
          - windows
  pull_request:
    paths:
      - "setup.py"
      - "pyproject.toml"
      - "csrc/**"
      - "astrai/**"
      - "tests/**"
    tags:
      - "v*"

jobs:
  build-cuda-linux:
    if: >-
      github.event_name != 'workflow_dispatch' ||
      inputs.platform == 'all' ||
      inputs.platform == 'linux'
    name: Build complete wheel (Linux, CUDA 13.0)
    runs-on: ubuntu-latest
    env:
      CSRC_KERNELS: "true"
      ASTRAI_CUDA_ARCH: "80;89;90;100;120a"
      BUILD_PARALLEL: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tools and CUDA-enabled PyTorch
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install torch==2.11.0 --index-url https://download.pytorch.org/whl/cu130

      - name: Set up CUDA Toolkit
        uses: Jimver/cuda-toolkit@v0.2.35
        with:
          cuda: "13.0.0"

      - name: Build wheel
        run: python -m pip wheel . --no-deps --no-build-isolation --wheel-dir dist

      - name: Diagnose Linux runner resources after a build failure
        if: failure()
        run: |
          echo "=== memory ==="
          free -h
          echo "=== cgroup memory events ==="
          cat /sys/fs/cgroup/memory.events || true
          echo "=== filesystem ==="
          df -h /
          echo "=== kernel log ==="
          sudo dmesg -T | tail -40 || true

      - uses: actions/upload-artifact@v4
        with:
          name: astrai-linux-cu130
          path: dist/*.whl
          if-no-files-found: error

  build-cuda-windows:
    if: >-
      github.event_name != 'workflow_dispatch' ||
      inputs.platform == 'all' ||
      inputs.platform == 'windows'
    name: Build complete wheel (Windows, CUDA 13.0)
    runs-on: windows-2022
    env:
      CMAKE_GENERATOR: "Ninja"
      CSRC_KERNELS: "true"
      ASTRAI_CUDA_ARCH: "80;89;90;100;120a"
      BUILD_PARALLEL: "2"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: amd64

      - name: Set up CUDA Toolkit
        uses: Jimver/cuda-toolkit@v0.2.35
        with:
          cuda: "13.0.0"

      - name: Install build tools and CUDA-enabled PyTorch
        run: |
          python -m pip install --upgrade pip setuptools wheel ninja
          python -m pip install torch==2.11.0 --index-url https://download.pytorch.org/whl/cu130

      - name: Build wheel
        run: python -m pip wheel . --no-deps --no-build-isolation --wheel-dir dist

      - uses: actions/upload-artifact@v4
        with:
          name: astrai-windows-cu130
          path: dist/*.whl
          if-no-files-found: error

  release:
    name: Attach Linux and Windows wheels to release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-cuda-linux, build-cuda-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Linux wheel
        uses: actions/download-artifact@v4
        with:
          name: astrai-linux-cu130
          path: release-assets/linux

      - name: Download Windows wheel
        uses: actions/download-artifact@v4
        with:
          name: astrai-windows-cu130
          path: release-assets/windows

      - name: Verify platform wheel files exist
        shell: bash
        run: |
          set -euo pipefail
          linux_wheels=(release-assets/linux/*.whl)
          windows_wheels=(release-assets/windows/*.whl)
          test "${#linux_wheels[@]}" -eq 1
          test "${#windows_wheels[@]}" -eq 1

      - name: Create release and upload wheels
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-assets/linux/*.whl
            release-assets/windows/*.whl
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
